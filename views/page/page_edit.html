<div class="container py-4">
    <h1 class="h4">Edit Custom Page</h1>
    <form id="editCustomPageForm" class="row g-4 shadow rounded p-3 mb-3" hx-post="/edit-custompage"
        hx-target="#responseContainer" hx-swap="outerHTML" hx-headers='{"X-No-Cache": "true"}' novalidate>

        <input type="hidden" id="id" name="id" value="{{ .ID }}">

        <div class="col-12 col-lg-8">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" name="title" value="{{ .Title }}" required>
                <div class="invalid-feedback">Please provide a title.</div>
            </div>

            <div class="mb-3">
                <label for="editor" class="form-label">Content</label>
                <div id="editor" role="textbox" aria-multiline="true" aria-label="Page content"
                    data-content="{{ .Content }}"></div>
                <input type="hidden" id="content_input" name="content">
            </div>

            <div class="d-flex flex-wrap gap-2">
                <button type="submit" class="btn btn-primary">Update Custom Page</button>
                <button type="button" class="btn btn-outline-secondary" data-preview="page">Preview</button>
                <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal"
                    data-bs-target="#exampleModal" hx-trigger="click" hx-get="/search-files"
                    hx-target="#file-list-container" hx-headers='{"X-No-Cache": "true"}'>Insert image</button>
            </div>
        </div>

        <div class="col-12 col-lg-4">
            <div class="mb-3">
                <div class="form-check form-switch">
                    <input type="checkbox" class="form-check-input" id="published" name="published"
                        {{ if .Published }}checked{{ end }}>
                    <label for="published" class="form-check-label">Published</label>
                </div>
                <div class="form-text">Unpublished pages return 404 to visitors.</div>
            </div>

            <div class="mb-3">
                <label for="slug" class="form-label">Slug</label>
                <input type="text" class="form-control" id="slug" name="slug" value="{{ .Slug }}" required
                    pattern="[a-z0-9-]+" aria-describedby="slug-hint">
                <div id="slug-hint" class="form-text">Lowercase letters, numbers and dashes.</div>
                <div class="invalid-feedback">Please provide a slug.</div>
            </div>

            <div class="mb-3">
                <label for="template" class="form-label">Template</label>
                <select id="template" name="template" class="form-select" required aria-describedby="template-hint">
                    <option value="page" {{ if eq .Template "page" }}selected{{ end }}>Default page</option>
                    <option value="page_sidebar" {{ if eq .Template "page_sidebar" }}selected{{ end }}>Page with
                        sidebar</option>
                    <option value="page_fullwidth" {{ if eq .Template "page_fullwidth" }}selected{{ end }}>Full-width
                        page</option>
                </select>
                <div id="template-hint" class="form-text">Controls the page layout within the active site
                    template.</div>
            </div>
        </div>
    </form>

    <div id="responseContainer" role="alert" aria-live="polite"></div>
</div>

{{template "partials/file-picker" .}}

{{template "partials/editor-assets" .}}
