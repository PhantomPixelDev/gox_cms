<div class="container py-4">
    <h1 class="h4">Add Custom Page</h1>
    <form id="addCustomPageForm" class="row g-4 shadow rounded p-3 mb-3" hx-post="/add-custompage"
        hx-target="#responseContainer" hx-swap="outerHTML" hx-headers='{"X-No-Cache": "true"}'>

        <div class="col-12 col-lg-8">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" id="title" name="title" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="editor" class="form-label">Content</label>
                <div id="editor" role="textbox" aria-multiline="true" aria-label="Page content"
                    data-content="{{ .Content }}"></div>
                <input type="hidden" id="content_input" name="content">
            </div>

            <div class="d-flex flex-wrap gap-2">
                <button type="submit" class="btn btn-primary">Add Custom Page</button>
                <button type="button" class="btn btn-outline-secondary" data-preview="page">Preview</button>
                <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal"
                    data-bs-target="#exampleModal" hx-trigger="click" hx-get="/search-files"
                    hx-target="#file-list-container" hx-headers='{"X-No-Cache": "true"}'>Insert image</button>
            </div>
        </div>

        <div class="col-12 col-lg-4">
            <div class="mb-3">
                <label for="slug" class="form-label">Slug</label>
                <input type="text" id="slug" name="slug" class="form-control" required pattern="[a-z0-9-]+"
                    aria-describedby="slug-hint">
                <div id="slug-hint" class="form-text">Lowercase letters, numbers and dashes — fills in from the
                    title.</div>
            </div>

            <div class="mb-3">
                <label for="template" class="form-label">Template</label>
                <select id="template" name="template" class="form-select" required aria-describedby="template-hint">
                    <option value="page">Default page</option>
                    <option value="page_sidebar">Page with sidebar</option>
                    <option value="page_fullwidth">Full-width page</option>
                </select>
                <div id="template-hint" class="form-text">Controls the page layout within the active site
                    template.</div>
            </div>
        </div>
    </form>

    <div id="responseContainer" role="alert" aria-live="polite"></div>
</div>

{{template "partials/file-picker" .}}

{{template "partials/editor-assets" .}}
