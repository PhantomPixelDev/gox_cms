<div class="wrapper col-12 col-sm-8 col-md-6 col-lg-4 mx-auto p-4 my-5">
    <div class="card shadow-sm">
        <div class="card-body">
    <h1 class="h3">Login</h1>
    <div id="login-error" class="text-danger" role="alert" aria-live="polite"></div>
    <hr>
    <!-- Login Form -->
    <form id="login-form" hx-post="/login" hx-target="#login-error" hx-swap="innerHTML" hx-disabled-elt="find button[type=submit]">


    

        <!-- Input fields for login -->
        <div class="mb-3">
            <label for="username" class="form-label">Username:</label>
            <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password:</label>
            <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
        </div>
        {{ if eq .Settings.CaptchaEnabled "true" }}
            <div class="h-captcha mb-3" data-sitekey="{{.Settings.CaptchaSiteKey}}"></div>
        {{ end }}
            <button type="submit" class="btn btn-primary w-100 py-2">
            Login
        </button>
    </form>
    <p class="mt-3 mb-0">
        Don't have an account? <a href="/register">Register</a>
    </p>
        </div>
    </div>

</div>
