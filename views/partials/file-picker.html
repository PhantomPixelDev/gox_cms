<!-- Shared file-picker modal for the post/page editors. The list container
     carries data-picker so Insert buttons (see file-manager.html) know an
     editor is waiting; the admin File Manager tab uses the same partials
     without the modal. -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <!-- The size class belongs on the dialog, not the .modal: on .modal it
         did nothing and the picker rendered at Bootstrap's 500px default. -->
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">File Manager</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                {{template "partials/file-upload" .}}
                <hr>
                {{template "partials/file-browser" .}}
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
