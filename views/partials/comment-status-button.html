{{/* Approve/unapprove toggle. Neutral outline, like the post status button:
     btn-success on a pending comment sat next to a yellow Pending badge and
     read as "approved". */}}
<button id="comment-status-button-{{.ID}}" class="btn btn-sm btn-outline-secondary"
    hx-post="/toggle-comment-status/{{.ID}}" hx-target="#comment-status-button-{{.ID}}"
    hx-confirm="Are you sure you want to change the status of this comment?" hx-swap="outerHTML"
    aria-label="{{if eq .Status "approved"}}Unapprove this comment{{else}}Approve this comment{{end}}">
    {{if eq .Status "approved"}}Unapprove{{else}}Approve{{end}}
</button>
