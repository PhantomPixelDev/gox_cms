    <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-4 g-3">
        {{range .Files}}
        <div class="col">
            <div class="card file-card shadow-sm h-100">
                <div class="card-img-container">
                    <img src="{{.Path}}" alt="Image Preview" class="card-img-top" loading="lazy">
                </div>
                <div class="card-body">
                    <p class="card-title text-truncate" title="{{.Name}}">{{ truncate .Name 20 }}</p>
                    <div class="btn-group btn-group-sm" role="group" aria-label="File actions">
                        <a href="{{.Path}}" class="btn btn-primary" target="_blank" rel="noopener"
                            aria-label="View file"><i class="bi bi-eye"></i></a>
                        <button class="btn btn-sm btn-danger" hx-delete="/delete-file"
                            hx-vals='{"name": "{{.Name}}"}'
                            hx-confirm="Are you sure you want to delete this file?"
                            data-after="updateFileList"
                            aria-label="Delete file"><i class="bi bi-trash"></i></button>
                        <button class="btn btn-sm btn-secondary" data-copy-url="{{.Path}}"
                            aria-label="Copy file URL"><i class="bi bi-clipboard"></i></button>
                    </div>
                </div>
            </div>
        </div>
        {{end}}
    </div>


{{template "partials/pagination" dict "Base" "/search-files" "Target" "#file-list-container" "TotalPages" .TotalPages "CurrentPage" .CurrentPage "SearchQuery" .SearchQuery}}
