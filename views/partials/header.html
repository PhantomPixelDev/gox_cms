<nav class="navbar navbar-expand-lg shadow-sm sticky-top {{ .Settings.NavbarClass }}">
    <div class="{{ .Settings.ContainerClass }}">

        <a class="navbar-brand logo" href="/">GOXCMS</a>
        {{/* No ms-auto here: the collapse below is flex-grow-1 and the menu
             inside it supplies the only auto margin, so a second one here
             would cancel it and collapse the layout. */}}
        <div class="d-flex align-items-center me-2 order-lg-last">
            <button id="btnSwitch" class="btn btn-sm btn-outline-secondary" type="button" data-theme-toggle
                aria-label="Toggle dark mode" title="Toggle dark mode" aria-pressed="false">
                <i class="bi bi-moon-stars" aria-hidden="true"></i>
            </button>
        </div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
            aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <div hx-get="/get-primary-menu?timestamp={{timestamp}}"
                hx-trigger="load" hx-swap="innerHTML" hx-headers='{"X-No-Cache": "true"}'
                class="d-lg-flex flex-lg-grow-1 align-items-lg-center">
                <noscript>
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="/blog">Blog</a></li>
                    </ul>
                </noscript>
                <span class="navbar-text placeholder-glow" aria-hidden="true">
                    <span class="placeholder col-2"></span>
                </span>
            </div>
            <form class="d-flex my-2 my-lg-0 ms-lg-3 flex-shrink-0" action="/search" method="get" role="search">
                <label for="nav-search" class="visually-hidden">Search</label>
                <input type="search" id="nav-search" name="q" class="form-control form-control-sm me-2"
                    placeholder="Search…" aria-label="Search posts and pages">
                <button type="submit" class="btn btn-sm btn-outline-primary" aria-label="Search">
                    <i class="bi bi-search" aria-hidden="true"></i>
                </button>
            </form>
        </div>
    </div>
</nav>
