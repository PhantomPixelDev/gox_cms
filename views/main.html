<!DOCTYPE html>
<html data-bs-theme="light" lang="{{ .Settings.Language }}">

<head>
    <title>{{ .Settings.Name }} - {{ .Title }}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ .Settings.SEODescription }}">
    <meta name="author" content="{{ .Settings.Name }}">
    <meta name="generator" content="GoXCMS">
    <meta name="theme-color" content="#2c3e50">
    <meta name="color-scheme" content="light dark">
    <meta property="og:site_name" content="{{ .Settings.Name }}">
    <meta property="og:title" content="{{ .Title }}">
    <meta property="og:type" content="website">
    {{ if .Settings.FaviconURL }}
    <link rel="icon" href="{{ .Settings.FaviconURL }}">
    {{ end }}
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://unpkg.com">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous" defer></script>
    {{ if .Settings.Theme }}
    <link href="/static/css/themes/{{ .Settings.Theme }}/bootstrap.min.css" rel="stylesheet">
    {{ else }}
    <link href="/static/css/themes/flatly/bootstrap.min.css" rel="stylesheet">
    {{ end }}

    <!-- Bootstrap CSS -->


    <link rel="stylesheet" href="/static/css/styles.css">

    <script src="https://unpkg.com/htmx.org@1.9.10"
        integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC"
        crossorigin="anonymous" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    <script src="/static/js/site.js" defer></script>
    <script src="/static/js/admin.js" defer></script>
    <script src="/static/js/editor.js" defer></script>

</head>

<body>

    <a class="skip-link" href="#main-content">Skip to content</a>

    {{template "partials/header" .}}

    <div class="{{ .Settings.ContainerClass }} p-3">

        <main id="main-content">

            {{embed}}

        </main>

    </div>



    <div class="position-fixed top-0 end-0 p-3 toast-stack">
        <div id="toast" class="toast align-items-center border-0 rounded-3 shadow-lg" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex p-2 rounded-3">
                <div id="toast-body" class="toast-body"></div>
                <button type="button" class="btn-close  me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>


    <div class="position-fixed top-0 end-0 p-3 toast-stack">
        <div id="toast-error" class="toast align-items-center border-0 rounded-3 shadow-lg bg-danger text-white" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex  p-2 rounded-3">
                <div id="toast-body-error" class="toast-body"></div>
                <button type="button" class="btn-close  me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    {{template "partials/footer" .}}

</body>

</html>
