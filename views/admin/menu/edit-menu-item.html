<div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">Edit Menu Item</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <form hx-post="/edit-menu-item/{{ .MenuItem.ID }}" hx-target="#menu-table-container"
                hx-headers='{"X-No-Cache": "true"}' hx-swap="none" data-after="updateMenuList">
                <input type="hidden" name="menu_item_id" value="{{ .MenuItem.ID }}">
                <div class="mb-3">
                    <label for="edit-item-title" class="form-label">Menu Item Title</label>
                    <input type="text" class="form-control" id="edit-item-title" name="menu_item_title"
                        value="{{ .MenuItem.Title }}" required>
                </div>
                <div class="mb-3">
                    <label for="edit-item-link" class="form-label">Menu Item Link</label>
                    <input type="text" class="form-control" id="edit-item-link" name="menu_item_link"
                        value="{{ .MenuItem.Link }}" required>
                </div>
                <div class="mb-3">
                    <label for="edit-item-menu" class="form-label">Menu</label>
                    <select class="form-select" id="edit-item-menu" name="menu_item_menu">
                        {{ $current := uintval .MenuItem.MenuID }}
                        {{ range .AllMenus }}
                        <option value="{{ .ID }}" {{ if eq .ID $current }}selected{{ end }}>{{ .Title }}{{ if .ParentID }} (submenu){{ end }}</option>
                        {{ end }}
                    </select>
                    <div class="form-text">Moving an item to a submenu indents it in the tree.</div>
                </div>
                <div class="mb-3">
                    <label for="edit-item-position" class="form-label">Item Position</label>
                    <input type="number" class="form-control" id="edit-item-position" name="item_position"
                        value="{{ .MenuItem.Position }}" required>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Menu Item</button>
                </div>
            </form>
        </div>
    </div>
</div>
