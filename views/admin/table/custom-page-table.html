
<div class="table-responsive mt-3">
    <table class="table table-hover table-bordered table-striped align-middle admin-table">
  
        <thead>
            <tr>
                <th scope="col">ID</th>
                <th>Page Name</th>
                <th>Slug</th>
                <th>Preview</th>
                <th>Edit</th>
                <th>Delete</th>

            </tr>
        </thead>
        <tbody>
            {{range .CustomPages}}
            <tr id="custompage-row-{{.ID}}">
                <td>{{.ID}}</td>
                <td>{{.Title }}</td>
                <td>{{.Slug}}</td>
                <td>
                    <a href="/{{.Slug}}" class="btn btn-sm btn-primary" target="_blank" rel="noopener" aria-label="View page"><i class="bi bi-eye"></i></a>
                    
                </td>
                <td>
                    <a href="/edit-custompage/{{.ID}}" class="btn btn-sm btn-warning" aria-label="Edit page"><i class="bi bi-pencil"></i></a>
                </td>
                <td>
                    <button class="btn btn-sm btn-danger" hx-delete="/delete-custompage/{{.ID}}" 
                    hx-confirm="Are you sure you want to delete this custom page?" hx-target="#custompage-row-{{.ID}}"
                    hx-swap="outerHTML">Delete</button>
                </td>
            </tr>
            {{end}}

        </tbody>

    </table>

</div>




{{template "partials/pagination" dict "Base" "/search-custompages" "Target" "#custompage-table-container" "TotalPages" .TotalPages "CurrentPage" .CurrentPage "SearchQuery" .SearchQuery}}
