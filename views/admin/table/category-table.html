<div class="table-responsive mt-3">
    <table class="table table-hover table-bordered table-striped align-middle admin-table">
        <thead>
            <tr>
                <th scope="col">ID</th>
                <th>Category Name</th>
                <th>Slug</th>
                <th>Used Times</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody>
            {{range .Categories}}
            <tr id="category-row-{{.ID}}">
                <td>{{.ID}}</td>
                <td>{{.Name}}</td>
                <td>{{.Slug}}</td>
                <td>{{.PostsCount }}</td>
                <td>
                    <button class="btn btn-sm btn-danger" hx-delete="/delete-category" hx-vals='{"id": "{{.ID}}"}' hx-confirm="Are you sure you want to delete this category?"  hx-target="#category-row-{{.ID}}" hx-swap="outerHTML">Delete</button>
                </td>
            </tr>
            {{end}}

        </tbody>

    </table>

</div>




<!-- Add Pagination -->

{{template "partials/pagination" dict "Base" "/search-categories" "Target" "#category-table-container" "TotalPages" .TotalPages "CurrentPage" .CurrentPage "SearchQuery" .SearchQuery}}


</div>
