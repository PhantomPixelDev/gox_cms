# GOXCMS Configuration File
database:
  driver: sqlite
  sqlite.dsn: "./data/database.sqlite"
  mysql.dsn: "user:password@tcp(db:3306)/mydb?charset=utf8mb4&parseTime=True&loc=Local"
  postgres.dsn: "user=user password=password dbname=mydatabase host=127.0.0.1 port=5432 sslmode=disable TimeZone=Asia/Shanghai"
server:
  host: "127.0.0.1"
  port: 3000
  # Prefork starts one process per CPU; keep it off with SQLite.
  prefork: false
  body_limit: 50
  # IPs/CIDRs of reverse proxies allowed to set X-Forwarded-For. Leave empty
  # when the app is reached directly.
  trusted_proxies: []
build:
  mode: production
app:
  name: "GoXCMS"
  version: "0.0.1"
  domain: "localhost"
  url: "http://localhost:3000"
  # Signs login tokens. Required in production; generate one with `openssl rand -hex 32`.
  secret: ""
  # Password for the "admin" account created on first start. Leave empty to
  # generate a random one, which is printed once to the log.
  admin_password: ""
upload:
  max_size_mb: 50
redis:
  enabled: false
  host: "127.0.0.1"
  port: 6379
  username: ""
  password: ""
  db: 0
  pool_size: 1000
  min_idle_conns: 10
  max_conn_age: 0
cors:
  # Defaults to app.url when empty.
  allowed_origins: ["http://localhost:3000"]
  allow_credentials: false
ratelimiter:
  enabled: true
  max_requests: 100
captcha:
  enabled: false
  public_key: ""
  secret_key: ""

